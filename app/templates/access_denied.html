<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Denied - Letsma MSP Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background-color:#f5f7fa;">
    <div class="card shadow-sm p-4 text-center" style="max-width:420px; width:100%;">
        <div class="mb-3">
            <i class="bi bi-shield-lock text-danger" style="font-size:2.5rem;"></i>
        </div>
        <h5 class="mb-2">Access Denied</h5>
        <p class="text-muted mb-4">{{ reason }}</p>
        <a href="/auth/login" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i> Back to sign in
        </a>
    </div>
</body>
</html>
