<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Letsma MSP Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav class="sidebar d-flex flex-column p-3">
        <div class="brand mb-4">
            <span class="brand-mark">LETSMA</span>
            <div class="brand-sub">MSP Platform</div>
        </div>
                <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="/dashboard" class="nav-link {% if active_page=='dashboard' %}active{% endif %}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            </li>
            <li>
                <a href="/customers" class="nav-link {% if active_page=='customers' %}active{% endif %}"><i class="bi bi-people me-2"></i>Customers</a>
            </li>
            <li>
                <a href="/tickets" class="nav-link {% if active_page=='tickets' %}active{% endif %}"><i class="bi bi-life-preserver me-2"></i>Helpdesk</a>
            </li>
            <li>
                <a href="/billing" class="nav-link {% if active_page=='billing' %}active{% endif %}"><i class="bi bi-receipt me-2"></i>Billing</a>
            </li>
            <li>
                <a href="/purchases" class="nav-link {% if active_page=='purchases' %}active{% endif %}"><i class="bi bi-box-seam me-2"></i>Purchasing</a>
            </li>
            <li>
                <a href="/licenses" class="nav-link {% if active_page=='licenses' %}active{% endif %}"><i class="bi bi-microsoft me-2"></i>O365 Licenses</a>
            </li>
            <li>
    <a href="/billing-settings" class="nav-link {% if active_page=='billing-settings' %}active{% endif %}">
        <i class="bi bi-gear me-2"></i>Billing Settings
    </a>
</li>

<li>
    <a href="/email-settings" class="nav-link {% if active_page=='email-settings' %}active{% endif %}">
        <i class="bi bi-envelope-check me-2"></i>Email Settings
    </a>
</li>

<li>
    <a href="/endpoints" class="nav-link {% if active_page=='endpoints' %}active{% endif %}">
        <i class="bi bi-hdd-network me-2"></i>Endpoints
    </a>
</li>
        </ul>
        <hr>
        <div class="small text-muted">
            <div><i class="bi bi-whatsapp"></i> WhatsApp ticketing</div>
            <div><i class="bi bi-microsoft-teams"></i> Teams ticketing</div>
            <div><i class="bi bi-file-earmark-text"></i> Xero invoicing</div>
            <a href="/docs" class="text-decoration-none">API docs &rarr;</a>
        </div>
    </nav>
    <main class="content flex-grow-1 p-4">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
